<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Explore3Dwebsites</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white min-h-screen flex flex-col items-center px-4 py-12">

  <header class="text-center mb-12">
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-gray-900">
      Explore3Dwebsites
    </h1>
    <p class="mt-3 text-gray-500 text-base sm:text-lg">
      A small curated list of stunning 3D & interactive experiences on the web.
    </p>
  </header>

  <main class="w-full max-w-md flex flex-col gap-6">

    <!-- Box 1: Bruno Simon -->
    <a
      href="https://bruno-simon.com/"
      target="_blank"
      rel="noopener noreferrer"
      class="group block rounded-2xl border border-gray-200 overflow-hidden bg-white shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:scale-[1.02]"
    >
      <div class="overflow-hidden">
        <img
          src="https://images.unsplash.com/photo-1503376780353-7e6692767b70"
          alt="Sports car"
          class="w-full h-48 object-cover transition-transform duration-500 group-hover:scale-110"
        />
      </div>
      <div class="p-5 flex items-center justify-between">
        <span class="text-lg font-semibold text-gray-900 capitalize">bruno simon</span>
        <svg class="w-5 h-5 text-gray-400 transition-transform duration-300 group-hover:translate-x-1 group-hover:text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </div>
    </a>

    <!-- Box 2: Radio Garden -->
    <a
      href="https://radio.garden/"
      target="_blank"
      rel="noopener noreferrer"
      class="group block rounded-2xl border border-gray-200 overflow-hidden bg-white shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:scale-[1.02]"
    >
      <div class="overflow-hidden">
        <img
          src="https://images.unsplash.com/photo-1590602847861-f357a9332bbc"
          alt="Vintage radio"
          class="w-full h-48 object-cover transition-transform duration-500 group-hover:scale-110"
        />
      </div>
      <div class="p-5 flex items-center justify-between">
        <span class="text-lg font-semibold text-gray-900 capitalize">radio garden</span>
        <svg class="w-5 h-5 text-gray-400 transition-transform duration-300 group-hover:translate-x-1 group-hover:text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </div>
    </a>

    <!-- Box 3: Sleep Well Creative -->
    <a
      href="https://sleep-well-creatives.com/"
      target="_blank"
      rel="noopener noreferrer"
      class="group block rounded-2xl border border-gray-200 overflow-hidden bg-white shadow-sm transition-all duration-300 hover:shadow-xl hover:-translate-y-1 hover:scale-[1.02]"
    >
      <div class="overflow-hidden">
        <img
          src="https://images.unsplash.com/photo-1541781774459-bb2af2f05b55"
          alt="Person sleeping peacefully"
          class="w-full h-48 object-cover transition-transform duration-500 group-hover:scale-110"
        />
      </div>
      <div class="p-5 flex items-center justify-between">
        <span class="text-lg font-semibold text-gray-900 capitalize">sleep well creative</span>
        <svg class="w-5 h-5 text-gray-400 transition-transform duration-300 group-hover:translate-x-1 group-hover:text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17 8l4 4m0 0l-4 4m4-4H3" />
        </svg>
      </div>
    </a>

  </main>

  <footer class="mt-16 text-sm text-gray-400 text-center">
    Built for exploring the best of the 3D web.
  </footer>

</body>
</html>
