  <script>
    const boxes = document.querySelectorAll('.box-btn');
    const boxContainer = document.getElementById('box-container');
    const resetBtn = document.getElementById('reset-btn');
    const body = document.body;

    boxes.forEach(box => {
      box.addEventListener('click', () => {
        const localFile = box.getAttribute('data-local');
        const fallback = box.getAttribute('data-fallback');

        // Try local file first; if it fails to load, fall back to Unsplash URL.
        const testImg = new Image();
        testImg.onload = () => {
          body.style.backgroundImage = `url('${localFile}')`;
        };
        testImg.onerror = () => {
          body.style.backgroundImage = `url('${fallback}')`;
        };
        testImg.src = localFile;

        boxContainer.style.display = 'none';
        document.getElementById('site-title').style.display = 'none';
        resetBtn.style.display = 'block';
      });
    });

    resetBtn.addEventListener('click', () => {
      body.style.backgroundImage = 'none';
      boxContainer.style.display = 'flex';
      document.getElementById('site-title').style.display = 'block';
      resetBtn.style.display = 'none';
    });
  </script>
